services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: unitrack_demo
      MYSQL_DATABASE: unitrack
    ports: ["3306:3306"]
    volumes:
      - unitrack_db:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-punitrack_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  app:
    build: .
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: unitrack_demo
      DB_NAME: unitrack
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q 'database.*connected'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
volumes:
  unitrack_db:
